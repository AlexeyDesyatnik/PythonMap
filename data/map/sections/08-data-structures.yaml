id: data-structures
title: Структуры данных
nodes:
  - id: stack
    kind: topic
    title: Стек
    description: Нужен, когда последнее начатое должно закончиться первым — проверка скобок, вложенные теги, вычисление выражений. Стек хранит элементы стопкой, в Python это список с append и pop.
    prerequisites: [list-tools]

  - id: queue
    kind: topic
    title: Очередь и дек
    description: Нужна, когда элементы обрабатываются в порядке поступления — моделирование очереди к кассе, задачи по одной в порядке прихода, обход графа в ширину. В Python это collections.deque, который быстро работает с обоими концами.
    prerequisites: [lists]

  - id: monotonic-stack
    kind: topic
    title: Ближайший больший элемент
    description: Для каждого элемента найти ближайший справа или слева больший — например, через сколько дней станет теплее. Стек, в котором элементы всегда упорядочены, решает это за один проход.
    prerequisites: [stack]

  - id: heap
    kind: topic
    title: Куча
    description: Нужна, когда из постоянно меняющегося набора всё время берут наименьший — задачи с приоритетами, k наибольших чисел, ближайшее событие. Модуль heapq отдаёт минимум и добавляет элемент быстро, без сортировки.
    prerequisites: [lists]

  - id: dsu
    kind: topic
    title: Система непересекающихся множеств
    description: Нужна, когда объекты постепенно объединяются в группы и надо быстро отвечать, в одной ли группе два объекта, — дружба в соцсети, связность дорог. Хранит для каждого элемента представителя его группы.
    prerequisites: [lists, functions]

  - id: segment-tree
    kind: topic
    title: Дерево отрезков
    description: Нужно, когда массив меняется и при этом часто спрашивают сумму или минимум на отрезке. Префиксные суммы тут не годятся, а дерево отрезков отвечает и обновляет за логарифмическое время.
    prerequisites: [recursion, lists]
