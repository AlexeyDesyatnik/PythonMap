id: collections
title: Хранение данных
nodes:
  - id: lists
    kind: topic
    title: Списки и кортежи
    description: Список хранит много значений под одним именем — элементы добавляют, читают и меняют по индексу, перебирают в цикле, вырезают срезами. Кортеж — неизменяемый список; распаковка присваивает несколько переменных сразу.
    prerequisites: [for-range]

  - id: list-tools
    kind: topic
    title: Функции и сортировка списков
    description: len, sum, min, max, методы списков, генераторы списков в квадратных скобках и сортировка sort и sorted. Заменяют многие циклы одной строкой.
    prerequisites: [lists]

  - id: matrix
    kind: topic
    title: Двумерные списки
    description: Список списков хранит таблицу — например, матрицу или игровое поле. Обходится вложенными циклами по строкам и столбцам.
    prerequisites: [lists, nested-loops]

  - id: sets
    kind: topic
    title: Множества
    description: Множество хранит значения без повторов и быстро проверяет, есть ли в нём элемент. Умеет объединение, пересечение и разность.
    prerequisites: [lists]

  - id: dicts
    kind: topic
    title: Словари
    description: Словарь хранит пары ключ — значение и находит значение по ключу. Типовой приём — подсчитать в словаре, сколько раз встретилось каждое значение.
    prerequisites: [for-range]
