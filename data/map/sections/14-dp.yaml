id: dp
title: Динамическое программирование
nodes:
  - id: dp-1d
    kind: topic
    title: Одномерная динамика
    description: Ответ для каждого n вычисляется по ответам для меньших n и хранится в списке. Типовые задачи — числа Фибоначчи и кузнечик.
    prerequisites: [list-basics]

  - id: dp-memo
    kind: topic
    title: Рекурсия с запоминанием
    description: Рекурсивная функция запоминает уже вычисленные ответы, например через functools.lru_cache. Делает медленную рекурсию быстрой.
    prerequisites: [recursion]

  - id: dp-2d
    kind: topic
    title: Двумерная динамика
    description: Таблица ответов для пар параметров. Типовая задача — число путей или самый выгодный путь по клеткам таблицы.
    prerequisites: [dp-1d, matrix]

  - id: dp-answer-restore
    kind: topic
    title: Восстановление ответа в динамике
    description: Проход по таблице динамики назад, чтобы вывести не только лучшее значение, но и сам путь или набор.
    prerequisites: [dp-1d]

  - id: lis
    kind: topic
    title: Наибольшая возрастающая подпоследовательность
    description: Классическая задача динамики по одномерному массиву, где каждый элемент сравнивается со всеми предыдущими.
    prerequisites: [dp-1d, nested-loops]

  - id: lcs
    kind: topic
    title: Наибольшая общая подпоследовательность
    description: Динамика по двум строкам или массивам. На ней же строится расстояние редактирования.
    prerequisites: [dp-2d]

  - id: knapsack
    kind: topic
    title: Задача о рюкзаке
    description: Выбор предметов с наибольшей суммарной ценностью при ограниченном весе. Типовая двумерная динамика.
    prerequisites: [dp-2d]

  - id: game-strategy
    kind: topic
    title: Выигрышные стратегии в играх
    description: Позиция выигрышная, если из неё есть ход в проигрышную, и проигрышная, если все ходы ведут в выигрышные. Такой анализ позиций записывается рекурсией.
    prerequisites: [recursion]
