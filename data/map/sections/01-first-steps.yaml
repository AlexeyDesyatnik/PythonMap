# Стартовая карта для скелета сайта. Её заменит настоящая структура (задача №4).
id: first-steps
title: Первые шаги
nodes:
  - id: first-program
    kind: topic
    title: Первая программа
    description: Программа, которая печатает текст на экран с помощью print. С неё начинается работа с Python.
    materials:
      - title: Документация Python — первые шаги
        url: https://docs.python.org/3/tutorial/introduction.html

  - id: variables
    kind: topic
    title: Переменные и присваивание
    description: Переменная хранит значение под именем, чтобы использовать его дальше в программе.
    prerequisites: [first-program]

  - id: input-numbers
    kind: topic
    title: Ввод чисел
    description: Чтение числа с клавиатуры через input и int. Без этого программа не может решать задачу для разных данных.
    prerequisites: [variables]
