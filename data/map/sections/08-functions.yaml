id: functions
title: Функции
nodes:
  - id: functions-def
    kind: topic
    title: Функции
    description: def создаёт функцию с параметрами, return возвращает результат. Функции позволяют не повторять код и разбивать задачу на части.
    prerequisites: [if-else]

  - id: scope
    kind: topic
    title: Локальные и глобальные переменные
    description: Переменные внутри функции не видны снаружи, а внешние без global нельзя изменить. Без этого функции ведут себя неожиданно.
    prerequisites: [functions-def]

  - id: lambda-key
    kind: topic
    title: lambda и сортировка по ключу
    description: lambda — короткая функция без имени. Чаще всего её передают в sorted, min и max, чтобы сравнивать элементы по нужному признаку.
    prerequisites: [functions-def, sorting-builtin]

  - id: recursion
    kind: topic
    title: Рекурсия
    description: Функция, которая вызывает саму себя для меньшей задачи. Нужна для задач, которые естественно сводятся к самим себе.
    prerequisites: [functions-def]
