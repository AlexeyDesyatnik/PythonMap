# «Основы Python» — первая ступень обеих целей (согласовано с автором).
goals:
  - id: ege
    title: ЕГЭ
    stages:
      - id: ege-python-basics
        title: Основы Python
        targets: &python-basics
          - print-args
          - f-strings
          - math-module
          - elif
          - logical-ops
          - loop-accumulate
          - loop-min-max
          - break-continue
          - digits-of-number
          - string-slices
          - string-loop
          - ord-chr
          - number-systems
          - list-functions
          - list-slices
          - list-comprehension
          - tuples
          - matrix
          - sets
          - dict-counting
          - scope
          - lambda-key
          - recursion
          - file-numbers
      - id: ege-basic
        title: Базовые задания
        targets: [ege-truth-table, ege-number-algorithm, ege-turtle, ege-words, ege-table-rows, ege-subnet-mask]
      - id: ege-intermediate
        title: Задания повышенного уровня
        targets: [ege-executor-programs, ege-number-systems, ege-logic-divisibility, ege-recursion, ege-sequence-pairs, ege-games, ege-processes, ege-dag-paths]
      - id: ege-advanced
        title: Задания высокого уровня
        targets: [ege-string-processing, ege-number-search, ege-sorting-processing, ege-data-analysis]
  - id: olympiad
    title: Олимпиады
    stages:
      - id: olympiad-python-basics
        title: Основы Python
        targets: *python-basics
      - id: olympiad-school
        title: Школьный этап
        targets: [itertools-enumeration, primes, gcd, base-conversion, simple-sorts, greedy, prefix-sums]
      - id: olympiad-municipal
        title: Муниципальный этап
        targets: [sieve, two-pointers, binary-search, counting-sort, merge-sort, stack, queue, dp-1d, dp-memo]
      - id: olympiad-regional
        title: Региональный этап
        targets:
          - modular-arithmetic
          - binary-search-answer
          - prefix-sums-2d
          - heap
          - connected-components
          - grid-bfs
          - dijkstra
          - mst
          - segment-tree
          - topological-sort
          - dp-2d
          - dp-answer-restore
          - lis
          - lcs
          - knapsack
