id: io
title: Ввод и вывод
nodes:
  - id: first-program
    kind: topic
    title: Первая программа
    description: Программа из одной строки, которая печатает текст с помощью print. С неё начинается работа с Python — запуск программы и чтение её вывода.

  - id: print-args
    kind: topic
    title: Вывод нескольких значений
    description: print с несколькими значениями через запятую и параметрами sep и end. Нужен, чтобы выводить ответ ровно в том виде, которого требует задача.
    prerequisites: [first-program]

  - id: variables
    kind: topic
    title: Переменные и присваивание
    description: Переменная хранит значение под именем, присваивание меняет его. На переменных держится любая программа сложнее одной строки.
    prerequisites: [first-program]

  - id: input-string
    kind: topic
    title: Ввод строки
    description: input читает строку, которую ввёл пользователь. Без ввода программа решает задачу только для одних, заранее записанных данных.
    prerequisites: [variables]

  - id: f-strings
    kind: topic
    title: Форматированный вывод
    description: f-строки подставляют значения переменных прямо в текст и задают число знаков после запятой. Нужны, чтобы выводить ответ в требуемом формате.
    prerequisites: [variables]
