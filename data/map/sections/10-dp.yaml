id: dp
title: Динамическое программирование
nodes:
  - id: dp-1d
    kind: topic
    title: Одномерная динамика
    description: Ответ для каждого n вычисляется по ответам для меньших n и хранится в списке. Типовые задачи — числа Фибоначчи и кузнечик.
    prerequisites: [lists]

  - id: dp-memo
    kind: topic
    title: Рекурсия с запоминанием
    description: Рекурсивная функция запоминает уже вычисленные ответы, например через functools.lru_cache. Делает медленную рекурсию быстрой.
    prerequisites: [recursion]

  - id: game-strategy
    kind: topic
    title: Выигрышные стратегии в играх
    description: Позиция выигрышная, если из неё есть ход в проигрышную, и проигрышная, если все ходы ведут в выигрышные. Такой анализ позиций записывается рекурсией.
    prerequisites: [recursion]

  - id: dp-2d
    kind: topic
    title: Двумерная динамика
    description: Таблица ответов для пар параметров — например, число путей или самый выгодный путь по клеткам. Проход по таблице назад восстанавливает сам путь.
    prerequisites: [dp-1d, matrix]

  - id: subsequences
    kind: topic
    title: Подпоследовательности
    description: Наибольшая возрастающая и наибольшая общая подпоследовательность — классические задачи динамики по одному и двум массивам.
    prerequisites: [dp-2d]

  - id: knapsack
    kind: topic
    title: Задача о рюкзаке
    description: Выбор предметов с наибольшей суммарной ценностью при ограниченном весе. Типовая двумерная динамика.
    prerequisites: [dp-2d]
