# «Основы Python» — первая ступень обеих целей (согласовано с автором).
goals:
  - id: ege
    title: ЕГЭ
    stages:
      - id: ege-python-basics
        title: Основы Python
        targets: &python-basics
          - sequence-processing
          - digits-of-number
          - files
          - matrix
          - sets
          - dicts
          - lambda-key
          - recursion
      - id: ege-basic
        title: Базовые задания
        targets: [ege-truth-table, ege-number-algorithm, ege-turtle, ege-words, ege-table-rows, ege-subnet-mask]
      - id: ege-intermediate
        title: Задания повышенного уровня
        targets: [ege-executor-programs, ege-number-systems, ege-logic-divisibility, ege-recursion, ege-sequence-pairs, ege-games, ege-processes, ege-dag-paths]
      - id: ege-advanced
        title: Задания высокого уровня
        targets: [ege-string-processing, ege-number-search, ege-sorting-processing, ege-data-analysis]

  - id: olympiad
    title: Олимпиады
    stages:
      - id: olympiad-python-basics
        title: Основы Python
        targets: *python-basics
      - id: olympiad-school
        title: Школьный этап
        targets: [itertools-enumeration, divisors-primes, gcd, number-systems, simple-sorts, greedy, prefix-sums]
      - id: olympiad-municipal
        title: Муниципальный этап
        targets: [sieve, two-pointers, binary-search, efficient-sorts, stack, queue, backtracking, dp-1d, dp-memo]
      - id: olympiad-regional
        title: Региональный этап
        targets:
          - modular-arithmetic
          - binary-search-answer
          - prefix-sums-2d
          - heap
          - monotonic-stack
          - segment-tree
          - grid-bfs
          - dijkstra
          - dag
          - mst
          - dp-2d
          - subsequences
          - knapsack
