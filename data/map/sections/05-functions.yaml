id: functions
title: Функции и рекурсия
nodes:
  - id: functions
    kind: topic
    title: Функции
    description: Функция — именованный кусок программы с параметрами, def создаёт её, return возвращает результат. Нужна, чтобы не повторять код и решать задачу по частям — например, вынести проверку «подходит ли число» в отдельную функцию.
    prerequisites: [conditions]

  - id: scope
    kind: topic
    title: Локальные и глобальные переменные
    description: Переменные внутри функции не видны снаружи, а внешние без global нельзя изменить. Без этого функции ведут себя неожиданно и портят чужие значения.
    prerequisites: [functions]

  - id: lambda-key
    kind: topic
    title: lambda и сортировка по ключу
    description: lambda — короткая функция без имени. Её передают в sorted, min и max, чтобы упорядочить, например, учеников по баллу или слова по длине.
    prerequisites: [functions, list-tools]

  - id: recursion
    kind: topic
    title: Рекурсия
    description: Функция, которая вызывает саму себя для меньшей задачи, пока не дойдёт до простого случая. Нужна для задач, которые естественно сводятся к самим себе; глубину рекурсии в Python ограничивают, и её можно увеличить через sys.setrecursionlimit.
    prerequisites: [functions]

  - id: backtracking
    kind: topic
    title: Перебор с возвратом
    description: Рекурсия строит решение шаг за шагом и отступает назад, если шаг завёл в тупик. Так перебирают варианты, которые нельзя записать фиксированным числом циклов, — расстановки, разбиения, пути.
    prerequisites: [recursion, lists]
