id: data-structures
title: Структуры данных
nodes:
  - id: stack
    kind: topic
    title: Стек
    description: Стек — последним положили, первым взяли; в Python это список с append и pop. Классическая задача — проверка правильности скобок.
    prerequisites: [list-functions]

  - id: queue
    kind: topic
    title: Очередь и дек
    description: Очередь — первым пришёл, первым ушёл. В Python её делают через collections.deque, который быстро работает с обоими концами.
    prerequisites: [list-basics]

  - id: heap
    kind: topic
    title: Куча
    description: Куча из модуля heapq быстро отдаёт наименьший элемент, даже когда элементы постоянно добавляются. Нужна для задач с приоритетами.
    prerequisites: [list-basics]

  - id: dsu
    kind: topic
    title: Система непересекающихся множеств
    description: Хранит разбиение на группы, быстро объединяет группы и проверяет, в одной ли группе два элемента.
    prerequisites: [list-basics, functions-def]

  - id: segment-tree
    kind: topic
    title: Дерево отрезков
    description: Отвечает на запросы о сумме или минимуме на отрезке и при этом быстро обновляет отдельные элементы. Нужно там, где префиксные суммы не годятся из-за изменений массива.
    prerequisites: [recursion, list-basics]
