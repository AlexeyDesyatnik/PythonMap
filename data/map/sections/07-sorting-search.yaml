id: sorting-search
title: Сортировка и поиск
nodes:
  - id: simple-sorts
    kind: topic
    title: Простые сортировки
    description: Сортировки пузырьком, выбором и вставками. Показывают, как устроена сортировка, и работают за квадратичное время.
    prerequisites: [lists, nested-loops]

  - id: greedy
    kind: topic
    title: Жадные алгоритмы
    description: На каждом шаге берётся лучший сейчас вариант — часто после сортировки. Важно уметь объяснить, почему такой выбор не испортит ответ.
    prerequisites: [list-tools]

  - id: prefix-sums
    kind: topic
    title: Префиксные суммы
    description: Массив сумм от начала до каждой позиции позволяет мгновенно находить сумму любого отрезка. Превращает много медленных подсчётов в быстрые.
    prerequisites: [lists, sequence-processing]

  - id: two-pointers
    kind: topic
    title: Два указателя
    description: Два индекса движутся по массиву в одну сторону или навстречу друг другу. Решает за линейное время задачи на пары и отрезки.
    prerequisites: [lists, while-loop]

  - id: binary-search
    kind: topic
    title: Бинарный поиск
    description: Поиск в упорядоченном массиве делением отрезка пополам, в том числе модулем bisect. Находит элемент за логарифмическое время.
    prerequisites: [lists, while-loop]

  - id: efficient-sorts
    kind: topic
    title: Быстрые сортировки
    description: Сортировка слиянием за n log n и сортировка подсчётом для небольших значений. На идее слияния держатся многие задачи.
    prerequisites: [recursion, lists]

  - id: binary-search-answer
    kind: topic
    title: Бинарный поиск по ответу
    description: Если по ответу можно быстро проверить, подходит ли он, ответ ищется бинарным поиском. Частый приём задач на оптимизацию.
    prerequisites: [binary-search]

  - id: prefix-sums-2d
    kind: topic
    title: Двумерные префиксные суммы
    description: Префиксные суммы для таблицы — сумма любого прямоугольника за одно действие.
    prerequisites: [prefix-sums, matrix]
