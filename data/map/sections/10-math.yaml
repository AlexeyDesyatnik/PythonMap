id: math
title: Перебор и теория чисел
nodes:
  - id: itertools-enumeration
    kind: topic
    title: Перебор комбинаций — itertools
    description: product, permutations и combinations из модуля itertools перебирают все наборы, перестановки и сочетания. Заменяют глубокую вложенность циклов при полном переборе.
    prerequisites: [tuples]

  - id: divisors
    kind: topic
    title: Делители числа
    description: Поиск всех делителей числа перебором до квадратного корня. Основа задач на делимость и простые числа.
    prerequisites: [for-range, div-mod]

  - id: primes
    kind: topic
    title: Проверка на простоту
    description: Число простое, если у него нет делителей, кроме единицы и самого себя. Проверка перебором делителей до корня.
    prerequisites: [divisors]

  - id: gcd
    kind: topic
    title: НОД и алгоритм Евклида
    description: Наибольший общий делитель быстро находится алгоритмом Евклида или функцией math.gcd. Через него же считают наименьшее общее кратное.
    prerequisites: [while-loop, div-mod]

  - id: base-conversion
    kind: topic
    title: Перевод в систему счисления
    description: Перевод числа в систему с любым основанием через остатки от деления. Нужен, когда основание больше 16 или цифры нужно обрабатывать по одной.
    prerequisites: [digits-of-number]

  - id: sieve
    kind: topic
    title: Решето Эратосфена
    description: Находит все простые числа до N сразу, вычёркивая кратные. Гораздо быстрее, чем проверять каждое число отдельно.
    prerequisites: [primes, list-basics]

  - id: modular-arithmetic
    kind: topic
    title: Арифметика по модулю
    description: Сложение, умножение и возведение в степень по модулю, в том числе pow с тремя аргументами. Нужна, когда ответ огромен и его требуют вывести по модулю.
    prerequisites: [div-mod]
