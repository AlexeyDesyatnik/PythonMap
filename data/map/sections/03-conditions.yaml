id: conditions
title: Условия
nodes:
  - id: if-else
    kind: topic
    title: Условный оператор
    description: Сравнения чисел и оператор if с веткой else выбирают, какую часть программы выполнить. Так программа по-разному отвечает на разные входные данные.
    prerequisites: [int-input]

  - id: elif
    kind: topic
    title: Несколько вариантов — elif
    description: Цепочка if, elif, else выбирает один вариант из многих. Нужна, когда возможных ответов больше двух.
    prerequisites: [if-else]

  - id: logical-ops
    kind: topic
    title: Логические операции
    description: and, or и not соединяют несколько условий в одно. Без них сложные условия приходится записывать вложенными if.
    prerequisites: [if-else]
