# «Основы Python» — первая ступень обеих целей (согласовано с автором).
# Следующие ступени ЕГЭ добавляются в задаче №6.
goals:
  - id: ege
    title: ЕГЭ
    stages:
      - id: ege-python-basics
        title: Основы Python
        targets: &python-basics
          - print-args
          - f-strings
          - math-module
          - elif
          - logical-ops
          - loop-accumulate
          - loop-min-max
          - break-continue
          - digits-of-number
          - string-slices
          - string-loop
          - ord-chr
          - number-systems
          - list-functions
          - list-slices
          - list-comprehension
          - tuples
          - matrix
          - sets
          - dict-counting
          - scope
          - lambda-key
          - recursion
          - file-numbers
  - id: olympiad
    title: Олимпиады
    stages:
      - id: olympiad-python-basics
        title: Основы Python
        targets: *python-basics
      - id: olympiad-school
        title: Школьный этап
        targets: [itertools-enumeration, primes, gcd, base-conversion, simple-sorts, greedy, prefix-sums]
      - id: olympiad-municipal
        title: Муниципальный этап
        targets: [sieve, two-pointers, binary-search, counting-sort, merge-sort, stack, queue, dp-1d, dp-memo]
      - id: olympiad-regional
        title: Региональный этап
        targets:
          - modular-arithmetic
          - binary-search-answer
          - prefix-sums-2d
          - heap
          - connected-components
          - grid-bfs
          - dijkstra
          - mst
          - segment-tree
          - topological-sort
          - dp-2d
          - dp-answer-restore
          - lis
          - lcs
          - knapsack
