id: numbers
title: Типы и арифметика
nodes:
  - id: int-arithmetic
    kind: topic
    title: Целые числа и арифметика
    description: Сложение, вычитание, умножение, возведение в степень и порядок действий. Целые числа в Python могут быть сколь угодно большими.
    prerequisites: [variables]

  - id: int-input
    kind: topic
    title: Ввод чисел и преобразование типов
    description: int и float превращают введённую строку в число, str — число в строку. Нужно в любой задаче, где на вход приходят числа.
    prerequisites: [input-string, int-arithmetic]

  - id: div-mod
    kind: topic
    title: Целочисленное деление и остаток
    description: Операции // и % дают частное и остаток. С их помощью проверяют делимость, работают с цифрами и временем.
    prerequisites: [int-arithmetic]

  - id: floats
    kind: topic
    title: Вещественные числа
    description: Дробные числа, обычное деление / и округление round. Важно помнить, что вещественные вычисления бывают неточными.
    prerequisites: [int-arithmetic]

  - id: math-module
    kind: topic
    title: Модуль math
    description: Подключение модуля через import и его функции — квадратный корень, округление вверх и вниз, число пи. Первое знакомство со стандартной библиотекой.
    prerequisites: [floats]

  - id: bitwise
    kind: topic
    title: Поразрядные операции
    description: Операции &, |, ^ и сдвиги работают с двоичной записью числа бит за битом. Нужны для масок и задач о двоичных разрядах.
    prerequisites: [number-systems]
